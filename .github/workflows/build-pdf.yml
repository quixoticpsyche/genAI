name: Build PDF

on:
  push:
    paths:
      - "tex/**"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: tex
          root_file: week1.tex

      - name: Move PDF into pdf/
        run: |
          mkdir -p pdf
          mv tex/week1.pdf pdf/GenAI_Week1_Reference.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenAI_Week1_Reference
          path: pdf/GenAI_Week1_Reference.pdf

      # Optional: commit the freshly built PDF back to the repo.
      # Uncomment if you want the committed pdf/ to always stay in sync.
